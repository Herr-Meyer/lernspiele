<style>

@media (max-width:760px){.pal{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);max-height:34vh;overflow:auto;gap:4px}.pal .pb{font-size:12px;padding:5px 6px}.tree{max-height:none}}

<script>
"use strict";
if (!window.THREE) document.body.innerHTML = '<p style="padding:20px;font-family:sans-serif">3D-Bibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen und neu laden.</p>';
"use strict";
// =====================================================================
//  NEUSTADT 2035 · 3D  –  Lernspiel zur Reihe "Verkehr der Zukunft"
//  TuN Klasse 10 · Inhalte nach Materialheft M1–M8 und Kursarbeit
// =====================================================================
const $ = (id) => document.getElementById(id);
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const de = (x) => String(x).replace(".", ",");

// ---------------------------------------------------------------- Speicher
const KEY = "neustadt2035_3d_v1";
const fresh = () => ({ team: "", money: 30, done: {}, recall: [], bricks: [], up: { hood: "#25f4ee", shoes: 0, board: false }, look: { skin: 0, hair: "kurz", hairCol: 0, top: "hoodie", col: "#25f4ee", g: {} }, owned: {}, ts: 0, pos: null, gp: null, finale: false, intro: false, calls: {}, prog: {}, tries: {} });
let S = fresh();
function load() { try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) S = Object.assign(fresh(), s); } catch (e) {} }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

// ---------------------------------------------------------------- Sound
let ACX = null, soundOn = true;
function beep(f = 660, d = 0.08, type = "square", v = 0.04, when = 0) {
  if (!soundOn) return;
  try {
    ACX = ACX || new (window.AudioContext || window.webkitAudioContext)();
    const o = ACX.createOscillator(), g = ACX.createGain(), t = ACX.currentTime + when;
    o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(ACX.destination); o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}
const sOk = () => { beep(660, .08, "square", .05); beep(990, .12, "square", .05, .08); };
const sNo = () => { beep(200, .2, "sawtooth", .05); };
const sCoin = () => { beep(1200, .06, "square", .04); beep(1600, .1, "square", .04, .06); };

// =====================================================================
//  3D-GRUNDGERÜST
// =====================================================================
const cv = $("c");
const isTouch = matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;
const RND = new THREE.WebGLRenderer({ canvas: cv, antialias: !isTouch, powerPreference: "high-performance" });
RND.setPixelRatio(Math.min(window.devicePixelRatio || 1, isTouch ? 1.5 : 2));
RND.outputEncoding = THREE.sRGBEncoding;
RND.toneMapping = THREE.ACESFilmicToneMapping; RND.toneMappingExposure = 0.95;
const scene = new THREE.Scene();
const FOGC = new THREE.Color(0x5a5470);
scene.fog = new THREE.Fog(FOGC, 70, 320);
scene.background = FOGC;
const cam = new THREE.PerspectiveCamera(62, 1, 0.1, 1200);
function resize() { const w = innerWidth, h = innerHeight; RND.setSize(w, h, false); cam.aspect = w / h; cam.fov = w < h ? 75 : 62; cam.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

// Himmel mit Synthwave-Sonne
const sky = new THREE.Group(); scene.add(sky);
sky.add(new THREE.Mesh(new THREE.SphereGeometry(600, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }",
  fragmentShader: "varying vec3 vP; void main(){ float h=vP.y; vec3 top=vec3(.07,.10,.24); vec3 mid=vec3(.36,.34,.52); vec3 hor=vec3(1.,.58,.32); vec3 c; if(h>0.){ c=mix(hor,mid,smoothstep(0.,.18,h)); c=mix(c,top,smoothstep(.18,.6,h)); } else { c=mix(hor*.55,vec3(.06,.02,.10),smoothstep(0.,-.15,h)); } gl_FragColor=vec4(c,1.); }",
})));
{
  const sun = new THREE.Mesh(new THREE.CircleGeometry(38, 48), new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, fog: false,
    vertexShader: "varying vec2 vU; void main(){ vU = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }",
    fragmentShader: "varying vec2 vU; void main(){ vec3 c=mix(vec3(1.,.55,.25),vec3(1.,.9,.6),vU.y); float r=length(vU-.5)*2.; if(r>1.) discard; gl_FragColor=vec4(c,smoothstep(1.,.7,r)); }",
  }));
  sun.position.set(-120, 30, -560); sky.add(sun);
  // Sterne
  const sg = new THREE.BufferGeometry(), sp = [];
  for (let i = 0; i < 500; i++) { const a = Math.random() * Math.PI * 2, e = 0.25 + Math.random() * 0.7; sp.push(Math.cos(a) * Math.cos(e) * 580, Math.sin(e) * 580, Math.sin(a) * Math.cos(e) * 580); }
  sg.setAttribute("position", new THREE.Float32BufferAttribute(sp, 3));
  sky.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, fog: false, transparent: true, opacity: .8 })));
}
scene.add(new THREE.HemisphereLight(0xb8c0e8, 0x3a3030, 0.95));
const sunL = new THREE.DirectionalLight(0xffb27a, 0.9); sunL.position.set(-60, 80, -200); scene.add(sunL);
scene.add(new THREE.AmbientLight(0x4a4a60, 0.35));

// Glüh-Textur für Lichter
function glowTex(col = "255,220,160") {
  const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d");
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, `rgba(${col},1)`); gr.addColorStop(.25, `rgba(${col},.5)`); gr.addColorStop(1, `rgba(${col},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
}
const GLOW = glowTex();
function textTex(text, color = "#ff2bd6", w = 512, h = 128, font = "bold 84px 'Chakra Petch', sans-serif", bg = null) {

function grade(p) {
  const B = [[90, 1], [75, 2], [60, 3], [45, 4], [20, 5], [0, 6]];
  for (const [lo, n] of B) if (p >= lo) { if (n === 6) return "6"; const hi = n === 1 ? 100 : B[n - 2][0], th = (hi - lo) / 3; return p >= lo + 2 * th ? n + "+" : p < lo + th ? n + "−" : "" + n; }
}
async function exam() {

const b64u = (bytes) => { let s = ""; for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };

      await talk("meyer", `Moin${S.team ? ", Team " + esc(S.team) : ""}! Ich bin Meyer, Werkstattchef. Reden ist Silber, Schrauben ist Gold. Und Apfelschorle ist flüssiges Gold.`);
      await talk("meyer", "Neustadt sucht eine Firma für die smarten Autos von morgen. In meiner Werkstatt programmierst du die Assistenzsysteme der sechs Projektkarten. Dein Programm fährt dann auf dem Testgelände ganz allein. In der Stadt warten außerdem Expertinnen und Experten zu den vier Expertenfeldern.");
      await talk("reuter", "Pfff. Ein Schrauber und ein paar Schüler mit Wortblöcken. Ich habe die Theorie, die Formeln und ein 400-Seiten-Gutachten. Die Stadtlizenz gehört mir!");
      await talk("meyer", "Lass ihn reden. Komm erst mal zu mir in die Werkstatt, die Lichtsäule zeigt dir den Weg. Mit dem Geld aus Aufträgen kaufst du dir übrigens FCK-Trikot, Fahne und Co. im Menü unter Avatar.", "Los geht's");
      setNav("meyer");
    } else if (S.pos) { pos.set(S.pos[0], .3, S.pos[1]); if (blockedAt(pos.x, pos.z)) pos.set(SPAWN[0], .3, SPAWN[1]); PL.position.copy(pos); }
    closePanel(); radio(pick(R_LINES));
  };
}

updCamera = function (dt) { _updCamera(dt); sunL.target.position.set(pos.x, 0, pos.z); sunL.position.copy(sunL.target.position).add(SUN_OFF); };
load(); hud(); applyLook(); resize(); title(); requestAnimationFrame(loop); cloudInit();
