<script>
"use strict";
// =====================================================================
//  BTA6 – Boeselager Technik Autoprojekt 6
//  Lernspiel zur Reihe "Verkehr der Zukunft" (TuN Klasse 10)
// =====================================================================
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const de = (v) => String(v).replace(".", ",");
const pick = (a) => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function mulberry(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rnd = mulberry(2035);
const rr = (a, b) => a + rnd() * (b - a);
const isTouch = matchMedia("(pointer: coarse)").matches;
const keys = {};

// ---------------------------------------------------------------- Ton
let ACX = null, soundOn = true;
function beep(f = 440, d = 0.08, type = "sine", vol = 0.05, delay = 0) {
  if (!soundOn) return;
  try {
    ACX = ACX || new (window.AudioContext || window.webkitAudioContext)();
    const t = ACX.currentTime + delay, o = ACX.createOscillator(), g = ACX.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(ACX.destination); o.start(t); o.stop(t + d + 0.02);
  } catch (e) { /* kein Ton verfügbar */ }
}
const sOk = () => { beep(660, 0.08); beep(990, 0.12, "sine", 0.05, 0.08); };
const sNo = () => beep(190, 0.2, "sawtooth", 0.04);
const sCoin = () => { beep(1200, 0.05, "square", 0.03); beep(1600, 0.09, "square", 0.03, 0.05); };
const sWin = () => [523, 659, 784, 1047, 1319].forEach((f, i) => beep(f, 0.18, "triangle", 0.06, i * 0.1));

// ---------------------------------------------------------------- Spielstand
const SAVE_KEY = "bta6_v2", OLD_KEY = "neustadt2035_3d_v1";
function fresh() {
  return { v: 2, name: "", team: "", money: 60, done: {}, tries: {}, prog: {}, recall: [], bricks: [], calls: {}, gp: null, finale: false, visited: {},
    up: { shoes: 0, board: false }, look: { skin: 1, hair: "kurz", hairCol: 1, top: 0, pants: 0, g: {} }, owned: {}, pos: null, intro: 0, gfx: "hoch", made: false, ts: 0 };
}
let S = fresh();
function adopt(o) {
  const f = fresh();
  for (const k in f) if (o[k] !== undefined && o[k] !== null && typeof o[k] === typeof f[k]) f[k] = o[k];
  if (o.gp && typeof o.gp === "object") f.gp = o.gp;
  if (Array.isArray(o.pos)) f.pos = o.pos;
  f.look = Object.assign(fresh().look, o.look && typeof o.look === "object" ? o.look : {}); f.look.g = Object.assign({}, f.look.g);
  f.up = Object.assign(fresh().up, o.up || {}); f.v = 2;
  return f;
}
function fromOld(o) { // Spielstand der ersten 3D-Version übernehmen
  const f = fresh();
  for (const k of ["money", "done", "tries", "prog", "recall", "bricks", "calls", "finale", "team", "owned"]) if (o[k] !== undefined && typeof o[k] === typeof f[k]) f[k] = o[k];
  if (o.gp) f.gp = o.gp;
  f.intro = Object.keys(f.done).length ? 2 : 0;
  return f;
}
function load() {
  try {
    const a = localStorage.getItem(SAVE_KEY);

function tfGame(time) {
  return new Promise((res) => {

    openPanel(`<div class="kick">Mythos oder Fakt · Speedrunde</div><div class="row" style="justify-content:space-between;margin:0"><b id="tfT"></b><b id="tfS"></b></div><div class="tfcard" id="tfC"></div><div class="combo" id="tfCo"></div><div class="tfb"><button class="btn" id="tfM">◀ MYTHOS</button><button class="btn" id="tfF">FAKT ▶</button></div><p class="keys">Tipp: Pfeiltasten links und rechts.</p>`);
    const show = () => { $("tfC").textContent = TF[items[k % items.length]][0]; $("tfS").textContent = "✔ " + right; };
    const ans = (v) => {
      if (t <= 0) return; const [s, a] = TF[items[k % items.length]];
      if (v === a) { right++; combo++; best = Math.max(best, combo); sOk(); $("tfCo").textContent = combo >= 3 ? `COMBO x${combo}!` : ""; }
      else { combo = 0; sNo(); wrong.push("tf" + items[k % items.length]); $("tfCo").innerHTML = `<span style="color:var(--or)">${esc(Q["tf" + items[k % items.length]].e)}</span>`; }
      k++; if (k >= items.length) end(); else show();
    };
    $("tfM").onclick = () => ans(false); $("tfF").onclick = () => ans(true);
    const kh = (e) => { if (e.code === "ArrowLeft") ans(false); if (e.code === "ArrowRight") ans(true); };
    window.addEventListener("keydown", kh);
    const iv = setInterval(() => { t--; $("tfT").textContent = "⏱ " + t + " s"; if (t <= 0) end(); }, 1000);
    $("tfT").textContent = "⏱ " + t + " s"; show();
    function end() {
      clearInterval(iv); window.removeEventListener("keydown", kh); t = 0;
